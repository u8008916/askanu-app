<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AskANU</title>
    <script>
      // Apply a saved theme before first paint so the page never flashes the
      // wrong palette. Key must match THEME_STORAGE_KEY in theme/useTheme.ts.
      // No stored value means follow the operating system.
      try {
        var t = localStorage.getItem('askanu-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {
        /* storage blocked: fall through to the system preference */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="frontend/src/main.tsx"></script>
  </body>
</html>
