<!doctype html>
<html lang="en-AU" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AskANU</title>
    <script>
      // Apply a saved theme before first paint so the page never flashes the
      // wrong palette. Key must match THEME_STORAGE_KEY in theme/useTheme.ts.
      // No stored value means light, regardless of the operating system.
      try {
        var t = localStorage.getItem('askanu-theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {
        /* Storage blocked: retain the explicit light default on <html>. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
